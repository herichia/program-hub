:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,36px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}

header p{margin:0 0 16px;opacity:.9}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{flex:none;color:var(--headink);text-decoration:none;font-weight:600;padding:12px 16px;border-radius:10px 10px 0 0;opacity:.85}
nav a[aria-current=page]{background:var(--bg);color:var(--acc);opacity:1}
h2{font-size:clamp(24px,3vw,32px);line-height:1.1;margin:0 0 6px}
h3{font-size:20px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
a{color:var(--acc)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}

button.pri,.btn.pri{background:var(--acc);color:var(--on)}

.end{justify-content:flex-end}

.subj{font-size:15px;margin:0 0 8px;overflow-wrap:anywhere}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin:16px 0 6px}
.seg button{border:0;min-height:42px}.seg button[aria-pressed=true]{background:var(--acc);color:var(--on)}

</style>

<div class="stat"><b>${nxt?esc(fmt(nxt.start,"short")):"None"}</b><span>${nxt?"next start: "+esc(nxt.p.name):"no upcoming start dates"}</span></div></div>`;
  h+=`<div class="ov"><div><h3>Upcoming dates <span class="small mut" style="font-weight:400">${up.length} found</span></h3>${filters}`;
  h+=up.length?`<ul class="dates">`+up.slice(0,+o.limit).map(x=>{const d=pd(x.d.date),n=days(x.d.date);
    if(x.note){const pn=(data.programs.find(p=>p.id===x.note.prog)||{}).name;return`<li><div class="cal" style="background:var(--fill)"><small>${d.toLocaleDateString("en-CA",{month:"short"})}</small><b>${d.getDate()}</b></div><div><div class="what"><span class="pill">Note</span> ${esc(x.note.text.split("\n")[0].slice(0,120))} <span class="soon"${n<0?' style="color:var(--bad)"':""}>${n<0?"overdue":away(n)}</span></div><div class="sub">My note${pn?" · "+esc(pn):""} · ${esc(fmt(x.d.date,"nodow"))} · <a href="#notes">open notes</a></div></div></li>`}
    return`<li><div class="cal"><small>${d.toLocaleDateString("en-CA",{month:"short"})}</small><b>${d.getDate()}</b></div><div><div class="what">${esc(x.d.label)} <span class="soon">${away(n)}</span></div><div class="sub">${esc(x.p.name)} · ${esc(x.i.name)} · ${esc(fmt(x.d.date,"nodow"))}</div></div></li>`}).join("")+`</ul>`+(up.length>+o.limit?`<p class="hint">Showing ${o.limit} of ${up.length}. Change "Show" to see more.</p>`:""):`<p class="empty">No dates match these filters.</p>`;
  h+=`</div><div><h3>Enrolment by intake</h3>`;
  h+=active.length?`<table class="stack"><thead><tr><th>Program and intake</th><th>Starts</th><th>Enrolled</th><th></th><th>Status</th></tr></thead><tbody>`+active.map(x=>`<tr class="click" data-act="goprog" data-id="${x.p.id}"><td><b>${esc(x.p.name)}</b><br><span class="small mut">${esc(x.i.name)}</span></td><td style="white-space:nowrap">${esc(x.start?fmt(x.start,"short"):"—")}</td><td class="num">${+x.i.enrolled||0}${x.i.target?" / "+(+x.i.target):""}</td><td style="width:22%">${bar(x.i)}</td><td>${status(x.i)}</td></tr>`).join("")+`</tbody></table>`:`<p class="empty">No intakes yet.</p>`;
  return h+`<p class="hint">Click a row to open that program. Update enrolment numbers on each program's page.</p></div></div>`;
}

function vPrograms(){
  const list=data.programs.filter(p=>!q||p.name.toLowerCase().includes(q));
  let h=`<div class="two"><aside class="side"><input id="search" type="search" placeholder="Search programs" aria-label="Search programs" value="${esc(q)}"><ul class="tabs">`+
    (list.length?list.map(p=>`<li><button class="tab" data-act="open" data-id="${p.id}" aria-current="${p.id===cur}"><span>${esc(p.name)}</span><small>${p.intakes.length} intakes</small></button></li>`).join(""):`<li class="empty">${data.programs.length?"No matches.":"No programs yet."}</li>`)+`</ul>`+
    (readOnly?"":`<form class="inl" data-form="addprog"><input name="name" placeholder="New program name" aria-label="New program name" autocomplete="off"><button class="pri">Add</button></form><button style="width:100%;margin-top:10px" data-act="bulk">Add dates to many programs</button>`)+`</aside><section>`;
  if(ui.bulk&&!readOnly)return h+bulkForm()+`</section></div>`;
  const p=P();
  if(!p)return h+`<h2>No program selected</h2><p class="mut">Add a program on the left, or paste your calendar on the <a href="#backup">${esc(nm("backup"))}</a> page.</p></section></div>`;
  const ed=!readOnly;
  h+=ui.rename?`<form class="inl" data-form="rename"><input name="name" value="${esc(p.name)}" aria-label="Program name" required><button class="pri">Save</button><button type="button" class="ghost" data-act="cancel">Cancel</button></form>`:
    `<h3 style="margin:0"><span style="font-size:clamp(24px,3vw,32px);line-height:1.1">${esc(p.name)}</span>${ed?`<span class="row"><button class="ghost" data-act="rename">Rename</button>${ui.confirm==="prog"?`<button class="danger" data-act="delprog">Delete program and everything in it</button><button class="ghost" data-act="cancel">Keep</button>`:`<button class="ghost" data-act="ask" data-w="prog">Delete</button>`}</span>`:""}</h3>`;
  const SN={intakes:"Intakes and dates",files:"Links and files",drafts:"Email drafts"};
  const secTitle=k=>{const custom=(data.settings.secNames||{})[k];if(ui.secEdit===k&&ed)return`<form class="secname" data-form="secname" data-v="${k}"><input name="n" value="${esc(custom||"")}" placeholder="${SN[k]}" aria-label="Section name"><button class="pri">Save</button><button type="button" class="ghost" data-act="cancel">Cancel</button></form>`;
    const t=custom||SN[k];return`<span>${esc(t)}${k==="drafts"&&!custom?" for "+esc(p.name):""}${ed?`<button type="button" class="ghost" data-act="secname" data-v="${k}" style="min-height:36px;font-size:14px;font-weight:600;margin-left:4px" title="Rename this section">Rename</button>`:""}</span>`};
  const mv=k=>ed?`<span class="row" style="gap:0">${ui.edit===`newintake`&&k==="intakes"||ui.edit==="addlink"&&k==="files"||ui.edit==="newdraft"&&k==="drafts"?"":`${k==="intakes"?`<button data-act="newintake">Add intake</button>`:k==="files"?`<button data-act="addlink">Add link</button>`:`<button data-act="newdraft">New draft</button>`}`}<button class="sq ghost" data-act="secmv" data-v="${k}" data-d="-1" aria-label="Move this section up" title="Move section up">↑</button><button class="sq ghost" data-act="secmv" data-v="${k}" data-d="1" aria-label="Move this section down" title="Move section down">↓</button></span>`:"";
  const S={};
  S.intakes=`<section class="box"><h3>${secTitle("intakes")}${mv("intakes")}</h3>`+(ui.edit==="newintake"?intakeForm({name:"",target:"",enrolled:"",dates:DEF_DATES.map(l=>({label:l,date:""}))},""):"");
  const ins=p.intakes.slice().sort((a,b)=>(startOf(a)||"9").localeCompare(startOf(b)||"9"));
  const endOf=i=>{const e=(i.dates||[]).find(d=>/end|finish|complete|grad/i.test(d.label)&&pd(d.date));return e?e.date:""};
  const isPast=i=>{const e=endOf(i),st=startOf(i);if(e)return days(e)<0;return st?days(st)<-60:false};
  const cur_=ins.filter(i=>!isPast(i)),past=ins.filter(isPast);const nxt=nextIntake(p);
  const isOpen=i=>ui.edit===i.id||openIntakes.has(i.id)||(!closedIntakes.has(i.id)&&nxt&&i.id===nxt.id);
  const card=i=>ui.edit===i.id?`<div>${intakeForm(i,i.id)}</div>`:`<details class="draft intake" data-iid="${i.id}"${isOpen(i)?" open":""}><summary><span style="flex:1;min-width:0"><span class="st">${esc(i.name)} ${status(i)}</span><span class="ss">${startOf(i)?"Starts "+esc(fmt(startOf(i),"short")):"No start date"} · ${+i.enrolled||0}${i.target?" of "+(+i.target):""} enrolled</span></span><span style="width:110px;flex:none" class="hide-sm">${bar(i)}</span></summary><div class="in">
<div class="row" style="margin:8px 0">${ed?`<button class="sq" data-act="enr" data-id="${i.id}" data-d="-1" aria-label="One fewer enrolled">−</button>`:""}<span style="flex:1"><b style="font-size:22px">${+i.enrolled||0}</b> <span class="mut">enrolled${i.target?" of "+(+i.target):""}</span>${bar(i)}</span>${ed?`<button class="sq" data-act="enr" data-id="${i.id}" data-d="1" aria-label="One more enrolled">+</button>`:""}</div>
<dl class="dl">${i.dates.filter(d=>d.label||d.date).map(d=>{const n=days(d.date);return`<dt>${esc(d.label)}</dt><dd class="${n!=null&&n<0?"past":""}">${esc(d.date?fmt(d.date,"short"):"—")}${n!=null&&n>=0&&n<=30?` <span class="soon">${away(n)}</span>`:""}</dd>`}).join("")}</dl>
${ed?`<div class="row"><button class="ghost" data-act="editintake" data-id="${i.id}">Edit dates</button><button class="ghost" data-act="dupintake" data-id="${i.id}">Copy to new term</button>${ui.confirm==="i"+i.id?`<button class="danger" data-act="delintake" data-id="${i.id}">Delete</button>`:`<button class="ghost" data-act="ask" data-w="i${i.id}">Delete</button>`}</div>`:""}</div></details>`;
  const iq=intakeQ.trim().toLowerCase();const match=i=>!iq||(i.name+" "+i.dates.map(d=>d.label+" "+fmt(d.date,"nodow")).join(" ")).toLowerCase().includes(iq);
  let shown=intakeView==="next"?(nxt&&!isPast(nxt)?[nxt]:[]):intakeView==="all"?ins:intakeView==="past"?past.slice().reverse():intakeView==="open"?cur_.filter(i=>days(startOf(i))!=null&&days(startOf(i))>=0&&!(+i.target&&(+i.enrolled||0)>=+i.target)):intakeView==="full"?ins.filter(i=>+i.target&&(+i.enrolled||0)>=+i.target):cur_;
  shown=shown.filter(match);
  const cnt={cur:cur_.length,next:nxt&&!isPast(nxt)?1:0,open:cur_.filter(i=>days(startOf(i))!=null&&days(startOf(i))>=0&&!(+i.target&&(+i.enrolled||0)>=+i.target)).length,full:ins.filter(i=>+i.target&&(+i.enrolled||0)>=+i.target).length,past:past.length,all:ins.length};
  const filt=ins.length>1?`<div class="row" style="margin:0 0 12px;background:var(--panel);border-radius:12px;padding:8px 10px"><label for="iv" class="small" style="margin:0">Show</label><select id="iv" style="width:auto;flex:1 1 200px">${[["cur","Current and upcoming"],["next","Next intake only"],["open","Upcoming with seats left"],["full","Full"],["past","Past"],["all","All intakes"]].map(([v,n])=>`<option value="${v}"${v===intakeView?" selected":""}>${n} (${cnt[v]})</option>`).join("")}</select><input id="iq" type="search" placeholder="Find an intake or date" aria-label="Find an intake" value="${esc(intakeQ)}" style="flex:1 1 200px;width:auto"></div>`:"";
  S.intakes+=ins.length?filt+`<div class="drafts">`+(shown.length?shown.map(card).join(""):`<p class="empty">No intakes match. Try "All intakes".</p>`)+`</div>`
    :`<p class="empty">No intakes yet. Add one for each start date, for example "January 2027".</p>`;
  S.intakes+=`</section>`;
  S.files=`<section class="box"><h3>${secTitle("files")}${mv("files")}</h3>`+(p.links.length?`<ul class="files">`+p.links.map((l,k)=>ui.edit==="link"+k?`<li>${linkForm(l,k)}</li>`:`<li class="file"><a class="name" href="${esc(l.url)}" target="_blank" rel="noopener">${linkIcon(l)}<span>${esc(l.label)}<span class="host">${esc(host(l.url))}</span></span></a>${ed?`<button class="ghost" data-act="editlink" data-k="${k}">Edit</button>${ui.confirm==="l"+k?`<button class="danger" data-act="dellink" data-k="${k}">Remove</button>`:`<button class="ghost" data-act="ask" data-w="l${k}">Remove</button>`}`:""}</li>`).join("")+`</ul>`:`<p class="empty">No links yet. Add your SharePoint files, Canva designs, Google files, websites or anything else with a link. In SharePoint, open a file's ⋯ menu and choose Copy link.</p>`)+(ui.edit==="addlink"?linkForm({label:"",url:""},""):"")+`</section>`;
  S.drafts=`<section class="box"><h3>${secTitle("drafts")}${mv("drafts")}</h3>${draftList(p.drafts,p.id)}</section>`;
  h+=data.settings.progOrder.map(k=>S[k]).join("");
  return h+`</section></div>`;
}

<button type="button" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button><button type="button" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button><button type="button" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>

function draftList(list,scope){
  let h="";if(ui.edit==="newdraft")h+=draftForm({title:"",to:"",subject:"",html:""},scope);
  const opts=scope==="admin"?[`<option value="">No intake (don't fill dates)</option>`].concat(data.programs.filter(p=>p.intakes.length).map(p=>`<optgroup label="${esc(p.name)}">`+p.intakes.map(i=>`<option value="${p.id}|${i.id}">${esc(p.name)} · ${esc(i.name)}</option>`).join("")+`</optgroup>`)):
    (()=>{const p=data.programs.find(x=>x.id===scope);return p.intakes.length?p.intakes.slice().sort((a,b)=>(startOf(a)||"9").localeCompare(startOf(b)||"9")).map(i=>`<option value="${p.id}|${i.id}">${esc(i.name)}${startOf(i)?" (starts "+esc(fmt(startOf(i),"short"))+")":""}</option>`):[`<option value="">Add an intake to fill dates</option>`]})();
  if(!list.length&&ui.edit!=="newdraft")return h+`<p class="empty">No drafts yet. Write [Start date], [Orientation] and other date names in square brackets, and they'll fill in from the intake you pick.</p>`;
  h+=`<div class="drafts">`+list.map(d=>{
    if(ui.edit===d.id)return draftForm(d,scope);
    const key=keyFor(d.id,scope);const sel=opts.join("").replace(`value="${key}"`,`value="${key}" selected`);
    const bodyPrev=fillHtml(d.html,key,true);const miss=(bodyPrev.match(/class="miss"/g)||[]).length+(fillText(d.subject,key,true).match(/class="miss"/g)||[]).length;
    return`<details class="draft" data-did="${d.id}"${openDrafts.has(d.id)?" open":""}><summary><span><span class="st">${esc(d.title||"Untitled draft")}</span><span class="ss">${d.subject?fillText(d.subject,key):"(no subject)"}</span></span></summary><div class="in">
<div class="fillrow"><label for="f-${d.id}" style="margin:0">Fill dates for</label><select id="f-${d.id}" data-fill="${d.id}">${sel}</select></div>
<p class="subj">${d.to?`<span class="mut">To:</span> ${esc(d.to)}<br>`:""}<span class="mut">Subject:</span> ${fillText(d.subject,key,true)||'<span class="mut">(none)</span>'}</p>
<div class="body">${bodyPrev||'<span class="mut">(empty)</span>'}</div>
${miss?`<p class="hint" style="margin:-4px 0 10px;color:var(--bad)">${miss} placeholder${miss>1?"s":""} still to fill in by hand (dashed in red).</p>`:""}
<div class="row"><button class="pri" data-act="copybody" data-id="${d.id}" data-s="${scope}">Copy message</button><button data-act="copysubj" data-id="${d.id}" data-s="${scope}">Copy subject</button><a class="btn" href="${esc(mailto(d.to,fillText(d.subject,key),htmlToText(fillHtml(d.html,key))))}" target="_blank" rel="noopener" title="Opens a new email. Formatting isn't carried over this way.">Open in Outlook</a>${readOnly?"":`<button class="ghost" data-act="editdraft" data-id="${d.id}">Edit</button><button class="ghost" data-act="dupdraft" data-id="${d.id}" data-s="${scope}">Duplicate</button>${ui.confirm==="d"+d.id?`<button class="danger" data-act="deldraft" data-id="${d.id}" data-s="${scope}">Delete</button>`:`<button class="ghost" data-act="ask" data-w="d${d.id}">Delete</button>`}`}</div></div></details>`}).join("")+`</div>`;
  return h+`<p class="hint">Click a draft to open it. Copy message keeps bold, lists, tables and links when you paste into Outlook. Open in Outlook starts a new email but sends plain text only, so paste the copied message over it if you need the formatting.</p>`;
}
function keyFor(id,scope){let key=fill[id];if(key===undefined||(key&&!findI(key))){if(scope==="admin")return"";const p=data.programs.find(x=>x.id===scope);const n=p&&nextIntake(p);key=n?p.id+"|"+n.id:""}return key}

  if(/\/:x:\/|\.(xlsx|xlsm|xls|csv)(\?|$|#)/.test(u))return"excel";if(/\/:w:\/|\.(docx?|rtf)(\?|$|#)/.test(u))return"word";if(/\/:p:\/|\.(pptx?)(\?|$|#)/.test(u))return"ppt";
  if(/\/:b:\/|\.pdf(\?|$|#)/.test(u))return"pdf";if(/\/:f:\/|\/forms\/allitems|\/shared%20documents\/?($|\?)/.test(u))return"folder";if(/\/:o:\/|onenote/.test(u))return"onenote";if(/\/:v:\/|youtube\.com|youtu\.be|vimeo\.com|stream\.microsoft/.test(u))return"video";
  if(/forms\.office\.com|forms\.microsoft\.com/.test(u))return"forms";if(/teams\.microsoft\.com|teams\.live\.com/.test(u))return"teams";if(/canva\.com|canva\.link/.test(u))return"canva";
  if(/docs\.google\.com\/document/.test(u))return"gdoc";if(/docs\.google\.com\/spreadsheets/.test(u))return"gsheet";if(/docs\.google\.com\/presentation/.test(u))return"gslide";if(/docs\.google\.com\/forms|forms\.gle/.test(u))return"gform";if(/drive\.google\.com/.test(u))return"gdrive";
  if(/brightspace|d2l/.test(u))return"brightspace";return"web"}
function linkIcon(l){
  if(l.icon==="custom"){const c=/^#[\da-f]{6}$/i.test(l.iconColor||"")?l.iconColor:"#5e5e66";const t=(l.iconText||"?").slice(0,3);return`<span class="xl" aria-hidden="true" style="background:${c};color:${lum(c)>.4?"#16161a":"#fff"};font-size:${t.length>2?"11px":"14px"}">${esc(t)}</span>`}

/* ---------- import / export ---------- */
function parseDate(s,order){s=(s||"").trim();if(!s)return"";let m;
  if(m=/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s))return mk(+m[1],+m[2],+m[3]);
  if(m=/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/.exec(s)){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;
    if(a>12)return mk(y,b,a);if(b>12)return mk(y,a,b);return order==="dmy"?mk(y,b,a):mk(y,a,b)}
  const d=new Date(s.replace(/(\d)(st|nd|rd|th)\b/,"$1"));return isNaN(d)?null:iso(d);
  function mk(y,mo,da){const d=new Date(y,mo-1,da);return d.getMonth()===mo-1?iso(d):null}}
function doImport(){
  const txt=$("imp").value.replace(/\r/g,"").trim();const msg=$("impmsg");
  if(!txt){msg.textContent="Paste your calendar first.";return}
  const rows=txt.split("\n").map(r=>r.split(r.includes("\t")?"\t":",").map(c=>c.trim().replace(/^"|"$/g,"")));
  const head=rows.shift();if(head.length<3){msg.textContent="I need at least three columns: Program, Intake and one date.";return}
  const order=$("dorder").value;let nP=0,nI=0,bad=0;
  rows.filter(r=>r.some(c=>c)).forEach(r=>{const pn=r[0],inn=r[1]||"Intake";if(!pn)return;
    let p=data.programs.find(x=>x.name.toLowerCase()===pn.toLowerCase());if(!p){p={id:uid(),name:pn,links:[],drafts:[],intakes:[]};data.programs.push(p);nP++}
    let i=p.intakes.find(x=>x.name.toLowerCase()===inn.toLowerCase());if(!i){i={id:uid(),name:inn,target:"",enrolled:"",dates:[]};p.intakes.push(i);nI++}
    head.slice(2).forEach((h,k)=>{const v=r[k+2]||"",hl=h.trim();if(!hl)return;
      if(/^target/i.test(hl)){if(v!=="")i.target=String(parseInt(v)||0);return}
      if(/^enrol/i.test(hl)){if(v!=="")i.enrolled=String(parseInt(v)||0);return}
      if(!v)return;const d=parseDate(v,order);if(!d){bad++;return}
      const ex=i.dates.find(x=>x.label.toLowerCase()===hl.toLowerCase());if(ex)ex.date=d;else i.dates.push({label:hl,date:d})})});
  normalize(data);save(true);cur=cur||data.programs[0]?.id;render();
  $("impmsg").textContent=`Done: ${nP} new program${nP===1?"":"s"}, ${nI} new intake${nI===1?"":"s"}${bad?`, ${bad} date${bad>1?"s":""} I couldn't read (left blank)`:""}.`;toast("Calendar imported");
}
async function doExport(){
  const text=JSON.stringify(data,null,2),name=(data.settings.name||"program-hub").replace(/[^\w-]+/g,"-").toLowerCase()+"-backup-"+iso(today())+".json";
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data:text});toast("Backup saved");return}}}catch(e){}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Backup downloaded")}catch(e){copyText(text,"Backup text")}
}

document.addEventListener("toggle",e=>{const t=e.target;if(t.matches&&t.matches("details[data-iid]")){const id=t.dataset.iid;if(t.open){openIntakes.add(id);closedIntakes.delete(id)}else{openIntakes.delete(id);closedIntakes.add(id)}return}if(t.matches&&t.matches("details.draft[data-did]")){if(t.open)openDrafts.add(t.dataset.did);else openDrafts.delete(t.dataset.did)}},true);

document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  if(f.dataset.form==="auth"){doAuth(f);return}
  if(f.dataset.form==="secname"&&!readOnly){data.settings.secNames=data.settings.secNames||{};data.settings.secNames[f.dataset.v]=f.elements.n.value.trim();reset();save();render();toast("Section renamed");return}
  if(f.dataset.form==="chpw"){const o=f.elements.old.value,n=f.elements.nw.value,er=$("cp-err");er.textContent="";
    if(n.length<8){er.textContent="Use at least 8 characters for the new password.";return}
    const u=auth.currentUser;if(!u)return;
    u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,o)).then(()=>u.updatePassword(n)).then(()=>{f.reset();toast("Password changed")})
      .catch(e=>{er.textContent=/invalid-credential|wrong-password|invalid-login/.test(e.code||"")?"Your current password isn't right.":e.code==="auth/too-many-requests"?"Too many tries. Wait a few minutes.":"Couldn't change it ("+(e.code||"error")+")."});return}
  if(readOnly)return;
  const v=n=>(f.elements[n]&&f.elements[n].value||"").trim(),k=f.dataset.form;
  if(k==="settings"){data.settings.name=v("name");data.settings.tagline=v("tagline");data.settings.color=$("st-c").value;data.settings.iconText=v("iconText").toUpperCase();data.dateStyle=v("dateStyle")||"long";save(true);applyTheme();render();toast("Settings saved");return}
  if(k==="addprog"){const n=v("name");if(!n)return;if(data.programs.some(p=>p.name.toLowerCase()===n.toLowerCase())){toast("That program already exists.");return}
    const p={id:uid(),name:n,links:[],drafts:[],intakes:[]};data.programs.push(p);normalize(data);cur=p.id;reset();save(true);render();return}
  if(k==="draft"){const body={title:v("title"),to:v("to"),subject:v("subject"),html:sanitize($("df-b").innerHTML)};
    const l=f.dataset.s==="admin"?data.admin:data.programs.find(p=>p.id===f.dataset.s).drafts;
    const id=f.dataset.id;if(id){const x=l.find(x=>x.id===id);if(x){Object.assign(x,body);delete x.body}openDrafts.add(id)}else{const nid=uid();l.push(Object.assign({id:nid},body));openDrafts.add(nid)}
    reset();save(true);render();toast("Draft saved");return}
  if(k==="note"){const body={text:f.elements.text.value.trim(),date:v("date"),prog:v("prog")};if(!body.text)return;const id=f.dataset.id;
    if(id)Object.assign(data.notes.find(x=>x.id===id)||{},body);else data.notes.push(Object.assign({id:uid(),created:Date.now(),done:false,pin:false},body));
    const sd=ui.showDone;reset();ui.showDone=sd;save(true);render();toast(id?"Note saved":"Note added");return}
  if(k==="bulk"){
    const ids=[...f.querySelectorAll("input[name=bp]:checked")].map(c=>c.value);if(!ids.length){toast("Tick at least one program.");return}
    const name=v("name");if(!name){toast("Give the intake a name.");return}
    const ls=[...f.querySelectorAll("#drows input[name=dl]")],ds=[...f.querySelectorAll("#drows input[name=dd]")];
    const dates=ls.map((l,j)=>({label:l.value.trim(),date:ds[j].value})).filter(d=>d.label&&d.date);let bad=0;
    v("txt").split("\n").forEach(line=>{line=line.trim();if(!line)return;const m=/^(.+?)\s*(?::|\s[-–—]\s|\t)\s*(.+)$/.exec(line);if(!m){bad++;return}const d=parseDate(m[2],"mdy");if(!d){bad++;return}
      const ex=dates.find(x=>x.label.toLowerCase()===m[1].trim().toLowerCase());if(ex)ex.date=d;else dates.push({label:m[1].trim(),date:d})});
    if(!dates.length){toast(bad?"I couldn't read those dates. Try a format like May 3, 2027.":"Enter at least one date.");return}
    let made=0,upd=0;const tg=v("target");
    ids.forEach(id=>{const p=data.programs.find(x=>x.id===id);if(!p)return;let i=p.intakes.find(x=>x.name.toLowerCase()===name.toLowerCase());
      if(!i){i={id:uid(),name,target:tg,enrolled:"",dates:[]};p.intakes.push(i);made++}else{upd++;if(tg)i.target=tg}
      dates.forEach(d=>{const ex=i.dates.find(x=>x.label.toLowerCase()===d.label.toLowerCase());if(ex)ex.date=d.date;else i.dates.push({label:d.label,date:d.date})})});
    reset();save(true);render();toast(`Dates added to ${ids.length} program${ids.length>1?"s":""}${made?` (${made} new intake${made>1?"s":""})`:""}${bad?`. ${bad} line${bad>1?"s":""} skipped`:""}`);return}
  if(k==="faq"){const body={q:v("q"),cat:v("cat")||"general",html:sanitize($("fq-a").innerHTML)};const id=f.dataset.id;
    if(id){const x=data.faqs.find(x=>x.id===id);if(x){Object.assign(x,body);delete x.answer}}else data.faqs.unshift(Object.assign({id:uid()},body));
    reset();ui.open=id||data.faqs[0].id;save(true);render();toast("FAQ saved");return}
  const p=P();if(!p)return;
  if(k==="rename"){const n=v("name");if(n)p.name=n;normalize(data)}
  if(k==="link"){const url=cleanUrl(v("url"));if(!url){toast("That link doesn't look right. Paste the full address.");return}
    const ic=v("icon")||"auto";const l={label:v("label")||"Untitled link",url,icon:ic==="auto"?"":ic};if(ic==="custom"){l.iconText=v("iconText").toUpperCase()||"?";l.iconColor=v("iconColor")}if(f.dataset.k==="")p.links.push(l);else p.links[+f.dataset.k]=l}

  reset();save(true);render();toast("Saved");
});
